<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Device Location</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #0b0f0b; }
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }
    #empty { display: flex; height: 100%; align-items: center; justify-content: center;
      font-family: -apple-system, sans-serif; color: #94a3b8; text-align: center; padding: 24px; }
    #routeInfo { position: absolute; z-index: 1000; left: 8px; bottom: 64px; background: rgba(11,15,11,0.85);
      color: #e2e8f0; font-family: -apple-system, sans-serif; font-size: 13px; padding: 6px 10px; border-radius: 8px; }
    #trackBar { position: absolute; z-index: 1000; left: 0; right: 0; bottom: 0; padding: 8px;
      font-family: -apple-system, sans-serif; display: none; }
    #trackButton { display: block; width: 100%; border: 1px solid #334155; background: #0f172a; color: #7ed957;
      font-size: 14px; font-weight: 600; padding: 10px; border-radius: 14px; }
    #trackButton.tracking { border-color: rgba(244,63,94,0.6); background: rgba(244,63,94,0.1); color: #fda4af; }
    #trackStatus { margin: 6px 0 0; text-align: center; font-size: 13px; color: #e2e8f0; }
    /* Google's embeddable viewer sits above the Leaflet canvas; the tactical
       layer stays mounted underneath so switching views keeps route state. */
    #googleWrap { position: absolute; inset: 0; z-index: 4; background: #0b0f0b; }
    #google { width: 100%; height: 100%; border: 0; }
    #viewBar { position: absolute; z-index: 1002; top: 8px; right: 8px; display: flex; gap: 4px; }
    .viewBtn { border: 1px solid rgba(148, 163, 184, 0.35); background: rgba(11, 15, 11, 0.85); color: #94a3b8;
      font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 8px; }
    .viewBtn.active { border-color: #7ed957; color: #7ed957; background: rgba(126, 217, 87, 0.12); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="googleWrap">
    <iframe id="google" title="Google Maps satellite view" allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <div id="viewBar">
    <button class="viewBtn" type="button" data-view="sat">Satellite</button>
    <button class="viewBtn" type="button" data-view="road">Map</button>
    <button class="viewBtn" type="button" data-view="tactical">Tactical</button>
  </div>
  <div id="trackBar">
    <button id="trackButton" type="button">Track my location live</button>
    <p id="trackStatus"></p>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/map-viewer.js"></script>
</body>
</html>
